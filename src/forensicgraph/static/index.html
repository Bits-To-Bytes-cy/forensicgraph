<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ForensicGraph | Digital Forensics Workbench</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
      * { box-sizing: border-box; } body { background:#08111f; color:#e5e7eb; margin:0; }
      header { border-bottom:1px solid #263653; background:#0d192b; padding:22px 4vw; }
      header h1 { margin:0; letter-spacing:-.03em; } header p { color:#94a3b8; margin:6px 0 0; }
      main { max-width:1400px; margin:auto; padding:26px 4vw; }
      .toolbar, .stats, .workspace { display:grid; gap:16px; }
      .toolbar { grid-template-columns: 1fr 1fr 2fr auto; align-items:end; }
      .stats { grid-template-columns:repeat(4,1fr); margin:20px 0; }
      .workspace { grid-template-columns:280px 1fr; }
      .content { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
      .card { background:#101d31; border:1px solid #263653; border-radius:12px; padding:17px; }
      .stat strong { display:block; font-size:28px; color:#67e8f9; }
      label { display:block; color:#94a3b8; font-size:13px; margin-bottom:5px; }
      input, textarea { width:100%; background:#091321; color:#e5e7eb; border:1px solid #3b4b6a;
        border-radius:7px; padding:10px; margin-bottom:11px; }
      textarea { min-height:285px; font:12px ui-monospace, monospace; }
      button { background:#22d3ee; color:#083344; border:0; border-radius:7px; padding:10px 14px;
        font-weight:700; cursor:pointer; } button.secondary { background:#334155; color:#e2e8f0; }
      .case { border:1px solid #263653; padding:11px; border-radius:8px; margin:8px 0; cursor:pointer; }
      .case:hover, .case.active { border-color:#22d3ee; background:#122640; }
      .case small, .muted { color:#94a3b8; } pre { white-space:pre-wrap; overflow:auto; max-height:430px;
        margin:0; font-size:12px; } .status { min-height:22px; color:#a7f3d0; margin-top:10px; }
      .danger { color:#fda4af; } @media(max-width:950px) {
        .toolbar,.stats,.workspace,.content { grid-template-columns:1fr; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>ForensicGraph</h1>
      <p>Evidence integrity and explainable incident reconstruction workbench</p>
    </header>
    <main>
      <section class="card toolbar">
        <div><label>Case ID</label><input id="caseId" value="demo-case-001"></div>
        <div><label>Case title</label><input id="caseTitle" value="Synthetic compromise"></div>
        <div><label>Description</label><input id="caseDescription" value="Authorized lab investigation"></div>
        <button onclick="createCase()">Create case</button>
      </section>
      <div id="status" class="status"></div>
      <section class="stats">
        <div class="card stat"><span class="muted">Cases</span><strong id="caseCount">0</strong></div>
        <div class="card stat"><span class="muted">Events</span><strong id="eventCount">0</strong></div>
        <div class="card stat"><span class="muted">Risk points</span><strong id="riskCount">0</strong></div>
        <div class="card stat"><span class="muted">Custody</span><strong id="custodyState">--</strong></div>
      </section>
      <section class="workspace">
        <aside class="card"><h2>Cases</h2><div id="cases" class="muted">Loading cases...</div></aside>
        <section class="content">
          <div class="card">
            <label for="events">Evidence events (JSON array)</label>
            <textarea id="events"></textarea>
            <button onclick="saveAndReport()">Save events &amp; generate report</button>
            <button class="secondary" onclick="loadDemo()">Load demo</button>
          </div>
          <div class="card"><h2>Investigation output</h2><pre id="output">Select a case or generate a report.</pre></div>
        </section>
      </section>
    </main>
    <script>
      const demo = [
        {event_id:"evt-001",occurred_at:"2026-01-01T10:00:00Z",source:"email",event_type:"Login",actor:"alice",details:{source_node:"internet",target_node:"vpn"}},
        {event_id:"evt-002",occurred_at:"2026-01-01T10:01:00Z",source:"endpoint",event_type:"credential_access",actor:"alice",details:{source_node:"vpn",target_node:"workstation"}},
        {event_id:"evt-003",occurred_at:"2026-01-01T10:03:00Z",source:"cloudtrail",event_type:"privilege_escalation",actor:"alice",details:{source_node:"workstation",target_node:"admin-role"}},
        {event_id:"evt-004",occurred_at:"2026-01-01T10:05:00Z",source:"cloudtrail",event_type:"mass_download",actor:"alice",details:{source_node:"admin-role",target_node:"s3-sensitive-data"}}
      ];
      const $ = id => document.getElementById(id);
      function message(text, danger=false) { $("status").textContent=text; $("status").className=danger?"status danger":"status"; }
      async function api(path, options={}) { const r=await fetch(path, options); const body=await r.json(); if(!r.ok) throw Error(body.detail||"Request failed"); return body; }
      function loadDemo() { $("events").value=JSON.stringify(demo,null,2); }
      async function createCase() {
        try { await api("/v1/cases",{method:"POST",headers:{"content-type":"application/json"},
          body:JSON.stringify({case_id:$("caseId").value,title:$("caseTitle").value,description:$("caseDescription").value})});
          message("Case created."); await loadCases();
        } catch(e) { message(e.message,true); }
      }
      async function loadCases() {
        try { const cases=await api("/v1/cases"); $("caseCount").textContent=cases.length;
          $("cases").innerHTML=cases.length?cases.map(c=>`<div class="case" onclick="selectCase('${c.case_id}')"><b>${c.title}</b><br><small>${c.case_id} · ${c.events.length} events</small></div>`).join(""):"<span class='muted'>No cases yet.</span>";
          $("eventCount").textContent=cases.reduce((n,c)=>n+c.events.length,0);
        } catch(e) { message(e.message,true); }
      }
      async function selectCase(id) {
        try { const c=await api("/v1/cases/"+encodeURIComponent(id)); $("caseId").value=c.case_id; $("caseTitle").value=c.title;
          $("caseDescription").value=c.description; $("events").value=JSON.stringify(c.events,null,2);
          if(c.report) render(c.report); message("Loaded "+id+".");
        } catch(e) { message(e.message,true); }
      }
      async function saveAndReport() {
        try { const id=$("caseId").value, events=JSON.parse($("events").value);
          try { await api("/v1/cases/"+encodeURIComponent(id)+"/events",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({events})}); }
          catch(e) { if(!e.message.includes("Case was not found")) throw e; await createCase(); await api("/v1/cases/"+encodeURIComponent(id)+"/events",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({events})}); }
          const report=await api("/v1/cases/report",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({case_id:id,events})});
          render(report); await loadCases(); message("Report saved and generated.");
        } catch(e) { message(e.message,true); }
      }
      function render(report) { $("output").textContent=JSON.stringify(report,null,2);
        $("eventCount").textContent=report.event_count;
        $("riskCount").textContent=(report.attack_graph.actor_risk||[]).reduce((n,a)=>n+a.risk_points,0);
        $("custodyState").textContent=report.custody.valid?"VALID":"CHECK";
      }
      loadDemo(); loadCases();
    </script>
  </body>
</html>
